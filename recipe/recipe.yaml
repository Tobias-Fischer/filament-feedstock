schema_version: 1

context:
  name: filament
  version: "1.76.1"
  python: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/google/filament/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f65b5b50ef5647a190b51a37fa006985e061bcfdc87c3b9b0ea18cf7b52042aa
  patches:
    # Remove when upstream guards the macOS 12-only enum values, or when the
    # conda-forge build moves to a macOS 12+ SDK.
    - patches/0001-guard-newer-metal-command-buffer-errors.patch
    # Backport google/filament#10299; remove when upstream lands an equivalent fix.
    - patches/0002-fix-neon-mask-types.patch
    # Remove when upstream supports selecting these system dependencies.
    - patches/0003-use-system-libpng-zlib.patch
    # Remove when upstream supports shared-library builds (google/filament#1075).
    - patches/0004-build-selected-shared-libraries.patch
    # Remove with the shared-library patch, or when upstream supports Windows DLLs.
    - patches/0005-fix-windows-shared-library-boundaries.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - python ${{ python }}.*
  host:
    - assimp
    - if: linux and target_platform != "linux-ppc64le"
      then: libegl-devel
    - if: linux and target_platform != "linux-ppc64le"
      then: libgl-devel
    - if: linux and target_platform != "linux-ppc64le"
      then: libgles-devel
    - if: linux and target_platform != "linux-ppc64le"
      then: libxcb
    - libpng
    # Use Filament's bundled copy until conda-forge publishes meshoptimizer
    # for Windows, Apple Silicon, and Linux Arm/PPC.
    - if: target_platform in ("linux-64", "osx-64")
      then: meshoptimizer
    - if: linux and target_platform != "linux-ppc64le"
      then: xorg-libx11
    - if: linux and target_platform != "linux-ppc64le"
      then: xorg-xorgproto
    - zlib
    - zstd
  run:
    - if: target_platform in ("linux-64", "osx-64")
      then: meshoptimizer
    - tsl_robin_map
    - zstd
  run_exports:
    - ${{ pin_subpackage('filament', upper_bound='x.x') }}
  ignore_run_exports:
    from_package:
      - if: linux and target_platform != "linux-ppc64le"
        then: libgles-devel

tests:
  - files:
      recipe:
        - bakedColor.mat
        - check_package_payload.py
        - test-cmake
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - if: target_platform == "linux-64"
          then: libvulkan-loader
        - if: target_platform == "linux-64"
          then: mesa-lavapipe
        - ninja
        - python ${{ python }}.*
        - if: target_platform == "linux-64"
          then: xorg-libx11
        - if: target_platform == "linux-64"
          then: xorg-xorgproto
    script:
      - python check_package_payload.py
      - matc --help
      - matinfo --help
      - cmgen --help
      - filamesh --help
      - if: target_platform != "linux-ppc64le"
        then: matc -a opengl -p desktop -o bakedColor.filamat bakedColor.mat
      - if: target_platform == "linux-ppc64le"
        then: matc -a vulkan -p desktop -o bakedColor.filamat bakedColor.mat
      - cmake -S test-cmake -B test-cmake-build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build test-cmake-build --verbose
      - if: target_platform == "linux-64"
        then: VK_DRIVER_FILES="$PREFIX/share/vulkan/icd.d/lvp_icd.x86_64.json" xvfb-run -a -s "-screen 0 640x480x24 -ac -extension GLX +extension RANDR" ./test-cmake-build/hello_world
      - if: unix and target_platform != "linux-64"
        then: ./test-cmake-build/hello_world
      - if: win
        then: .\test-cmake-build\hello_world.exe

about:
  summary: Real-time physically based rendering engine
  description: |
    Filament is a real-time physically based rendering engine for Android,
    iOS, Windows, Linux, macOS, and WebGL2. This package provides host-side
    command line tools and a constrained shared C++ development surface for
    downstream consumers.
  license: Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND MIT AND Zlib
  license_file:
    - LICENSE
    - third_party/basisu/LICENSE
    - third_party/benchmark/LICENSE
    - third_party/cgltf/LICENSE
    - third_party/civetweb/LICENSE.md
    - third_party/clang/LICENSE.TXT
    - third_party/dawn/LICENSE
    - third_party/getopt/LICENSE
    - third_party/gl-matrix/LICENSE.md
    - third_party/glslang/LICENSE
    - third_party/glslang/LICENSE.txt
    - third_party/gltumble/LICENSE
    - third_party/jsmn/LICENSE
    - third_party/libgtest/LICENSE
    - third_party/markdeep/LICENSE
    - third_party/robin-map/LICENSE
    - third_party/smol-v/LICENSE
    - third_party/spirv-cross/LICENSE
    - third_party/spirv-cross/LICENSES/LicenseRef-KhronosFreeUse.txt
    - third_party/spirv-headers/LICENSE
    - third_party/spirv-tools/LICENSE
    - third_party/stb/LICENSE
    - third_party/tinyexr/LICENSE
    - third_party/vkmemalloc/LICENSE.txt
  homepage: https://github.com/google/filament
  repository: https://github.com/google/filament

extra:
  feedstock-name: filament
  recipe-maintainers:
    - jeongseok-meta
